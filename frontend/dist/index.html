  <script>
    /* Before first paint: the saved theme, typography and sidebar rail, so a reload never
       flashes the wrong colours, fonts or the wide sidebar. Under ?record the page
       waits for the rig and ignores saved choices. */
    (function (d) {
      d.classList.add('js');
      var rec = /[?&]record\b/.test(location.search);
      if (rec) d.classList.add('is-record');
      try {
        if (!rec) {
          var t = JSON.parse(localStorage.getItem('tessly:theme') || '"light"');
          var isDark = t === 'system' ? matchMedia('(prefers-color-scheme: dark)').matches : t === 'dark';
          d.dataset.theme = isDark ? 'dark' : 'light';
          if (localStorage.getItem('tessly:rail') === '1') d.classList.add('is-rail');

          // Pre-paint theme color & font tokens
          var tc = JSON.parse(localStorage.getItem('tessly:theme-config') || 'null') || {};
          var pCol = tc.primaryColor || '#7627c4';
          var sCol = tc.secondaryColor || '#4d33b6';
          var hFont = tc.headerFont || 'Plus Jakarta Sans';
          var pFont = tc.paragraphFont || 'Inter';
          if (isDark) {
            d.style.setProperty('--primary', '#b88bf8');
            d.style.setProperty('--primary-ink', '#e9d5ff');
            d.style.setProperty('--on-primary', '#150928');
            d.style.setProperty('--secondary', '#9076fa');
          } else {
            d.style.setProperty('--primary', pCol);
            d.style.setProperty('--primary-ink', '#5b1d9c');
            d.style.setProperty('--on-primary', '#ffffff');
            d.style.setProperty('--secondary', sCol);
            d.style.setProperty('--secondary-ink', '#38248c');
          }
          d.style.setProperty('--font-heading', "'" + hFont + "', 'Plus Jakarta Sans', 'Outfit', 'Urbanist', -apple-system, sans-serif");
          d.style.setProperty('--font-paragraph', "'" + pFont + "', 'Inter', 'Plus Jakarta Sans', 'Urbanist', -apple-system, sans-serif");
          d.style.setProperty('--font', "var(--font-paragraph)");
        }
      } catch (e) {}
      /* rail-on: the saved choice at 1280 and up, always between 761 and 1279 */
      var rail = function () { var w = innerWidth; d.classList.toggle('rail-on', w > 760 && (w < 1280 || d.classList.contains('is-rail'))); };
      rail(); addEventListener('resize', rail); window.__rail = rail;
      if (!rec) setTimeout(function () { d.classList.add('failsafe'); }, 4000);
      
      // Determine base path for asset loading
      window.__TESSLY_BASE__ = location.pathname.includes('/tessly') ? '/tessly/' : '/';

      // Remove (#) from URL completely if arriving via legacy hash URL
      if (location.hash && location.hash.startsWith('#/')) {
        try {
          var cleanRoute = location.hash.replace(/^#/, '');
          history.replaceState(null, '', cleanRoute);
        } catch (e) {}
      }
    })(document.documentElement);
  </script>

  <style>
    /* ====================================================================
       GLOBAL THEMED NATIVE CONTROLS — forces every native form widget
       (number spinner, <select> popup, date/calendar picker) to follow the
       APP's light/dark theme instead of the OS appearance. Placed as the
       last <style> in <head> so it overrides any framework CSS.
       ==================================================================== */

    /* 1) Remove number input up/down spin buttons — globally */
    input[type="number"]{ -moz-appearance: textfield; appearance: textfield; }
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button{ -webkit-appearance: none; margin: 0; }

    /* 2) Lock native widget chrome to the active app scheme (single value,
         so the OS dark/light preference can NOT override it). Default light;
         dark only when the app is in dark mode. */
    input, select, textarea{ color-scheme: light; }
    :root[data-theme="dark"] input,
    :root[data-theme="dark"] select,
    :root[data-theme="dark"] textarea{ color-scheme: dark; }

    /* 3) Native <select> listbox + options inherit the app surface */
    select, select option{ background-color: var(--card, #ffffff); color: var(--text, #141a26); }
    select option:checked{ background-color: var(--primary, #7627c4); color: var(--on-primary, #fff); }
    select option:disabled{ color: var(--faint, #7d8697); }

    /* 4) Date / month / time calendar indicator + popups */
    input[type="date"], input[type="month"], input[type="time"], input[type="datetime-local"]{ color-scheme: inherit; }
    input::-webkit-calendar-picker-indicator{ cursor: pointer; opacity: .8; }
    :root[data-theme="dark"] input::-webkit-calendar-picker-indicator{ filter: invert(1); }

    /* ====================================================================

       ==================================================================== */
    :root {
      --primary: #7627c4;
      --primary-ink: #5b1d9c;
      --on-primary: #ffffff;
      --secondary: #4d33b6;
      --secondary-ink: #38248c;
      --font-heading: "Plus Jakarta Sans", "Outfit", "Urbanist", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --font-paragraph: "Plus Jakarta Sans", "Inter", "Urbanist", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --font: var(--font-paragraph);
    }
    :root[data-theme="dark"] {

      --on-primary: #150928;
      --secondary: #9076fa;
      --secondary-ink: #dcd2fe;
    }

    .card__title, .page-head__title, .page-head h1,
    .admin-group__title, .section-title, .brand__title,

    }

    .btn, .btn--primary, .btn--ghost, .btn--sm, .st-actions .btn {
      font-family: var(--font-heading);
      font-weight: 600;
    }
    .tabs .tab, .ivb-tabs .tab, .nav__item {

    /* Primary theme color for buttons & active states */
    .btn--primary, .st-actions .btn--primary, .top .btn--primary.top__new {
      background: var(--primary) !important;
      color: var(--on-primary) !important;
    }
    :focus-visible, .input:focus, .select:focus, .textarea:focus {
      outline-color: var(--primary) !important;
      border-color: var(--primary) !important;
    }
    .st-theme.is-on {
      border-color: var(--primary) !important;
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 22%, transparent) !important;
    }
    .st-theme__ok {

    /* SIDEBAR PROTECTION ("except sidebar") — retains dark aesthetic & citron accent */
    .side {
      background: var(--side, #121417) !important;

    .side .side__goal-bar i {

    /* GLOBAL SCREEN ZOOM IN / OUT FLUID RESPONSIVE ENGINE */
    :root {
      --app-max: 100% !important;
    }
    .app {
      max-width: 100% !important;
      width: 100% !important;
      margin: 0 !important;
    }
    .side {
      left: var(--side-x, 14px) !important;
    }
    @media (min-width: 761px) {
      .main {
        padding-left: calc(var(--side-w, 248px) + var(--side-x, 14px) + var(--gutter, 16px)) !important;
        padding-right: var(--gutter, 16px) !important;
        width: 100% !important;
        box-sizing: border-box !important;
      }
      html.rail-on .main {
        padding-left: calc(var(--rail-w, 84px) + var(--side-x, 14px) + var(--gutter, 16px)) !important;
        padding-right: var(--gutter, 16px) !important;
        width: 100% !important;
        box-sizing: border-box !important;
      }
    }
    @media (max-width: 760px) {
      .main {
        padding-left: var(--gutter, 12px) !important;
        padding-right: var(--gutter, 12px) !important;
        width: 100% !important;
        box-sizing: border-box !important;
      }
    }
  </style>
