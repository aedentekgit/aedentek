name: aedentek-crm

# =====================================================================
# Aedentek CRM (Tessly) — Live + Staging on one VPS
#
# Isolation (does NOT affect other projects / DBs):
#   - Live:     aedentek_crm_live     DB | port 5063 | uploads/live
#   - Staging:  aedentek_crm_staging  DB | port 5064 | uploads/staging
#   - "dev" reuses the STAGING DB + STAGING upload folder (dev alias)
# Mongo is the shared host mongo container (host.docker.internal:27017).
# Each service only ever talks to its own DB name -> no cross-contamination.
#
# Secrets live ONLY on the VPS, never in git:
#   .env.live     -> JWT_SECRET, MONGODB_URI (aedentek_crm_live)
#   .env.staging  -> JWT_SECRET, MONGODB_URI (aedentek_crm_staging)
# Templates: deploy/env.live.example, deploy/env.staging.example
#
# Ports are bound to 127.0.0.1 so the app is reachable only through
# host nginx (HTTPS), never directly on http://<VPS-IP>:5063.
# =====================================================================

x-common: &common
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  extra_hosts:
    - "host.docker.internal:host-gateway"
  deploy:
    resources:
      limits:
        memory: 1.5G
        cpus: "1.0"

services:
  # ---------------- LIVE (crm.aedentek.in) ----------------
  live:
    <<: *common
    container_name: aedentek-crm-live
    image: aedentekgithub/aedentek-crm:latest
    ports:
      - "127.0.0.1:5063:5000"
    env_file:
      - .env.live
    environment:
      - PORT=5000
      - NODE_ENV=production
      - PUBLIC_DIR=/app/public
      - UPLOAD_DIR=/app/uploads
      # Demo accounts are not (re)created in production
      - SEED_DEMO_USERS=false
      # URL the frontend expects for API/asset calls in production
      - VITE_API_BASE=
    volumes:
      - ./uploads/live:/app/uploads

  # ---------------- STAGING (staging.crm.aedentek.in; also used by dev) ----------------
  staging:
    <<: *common
    container_name: aedentek-crm-staging
    image: aedentekgithub/aedentek-crm:staging
    ports:
      - "127.0.0.1:5064:5000"
    env_file:
      - .env.staging
    environment:
      - PORT=5000
      - NODE_ENV=staging
      - PUBLIC_DIR=/app/public
      - UPLOAD_DIR=/app/uploads
    volumes:
      - ./uploads/staging:/app/uploads
